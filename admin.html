<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Advocate Rajkumar Rao</title><link rel="stylesheet" href="assets/style.css"></head><body class="admin"><header class="adminbar"><div class="container">⚖️ <b>Advocate Rajkumar Rao — Admin Panel</b></div></header><div class="admin-layout"><aside class="sidebar"><button class="side active" data-tab="dashboard">Dashboard</button><button class="side" data-tab="consultations">Consultation Requests</button><button class="side" data-tab="blogs">Blog Articles</button><a class="side" href="index.html">← Open Website</a></aside><main class="admin-main"><div id="login"><div class="card" style="max-width:430px;margin:55px auto"><h2>Admin Login</h2><p class="muted">Apps Script में सेट किया हुआ admin password डालें।</p><input id="password" type="password" placeholder="Admin Password"><button id="loginBtn" class="btn btn-dark" style="margin-top:12px">Login</button><p id="loginMsg"></p></div></div><div id="panel" class="hidden"><section id="dashboard" class="tab"><h2>Dashboard</h2><div id="stats" class="stats"></div></section><section id="consultations" class="tab hidden"><h2>Consultation Requests</h2><div class="card table-wrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Case</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody id="consultBody"></tbody></table></div></section><section id="blogs" class="tab hidden"><div class="grid2"><div class="card"><h2>Article Editor</h2><form id="blogForm"><input type="hidden" name="id"><label>Title *</label><input name="title" required><label>Category</label><input name="category" value="Legal Awareness"><label>Excerpt</label><textarea name="excerpt" style="min-height:90px"></textarea><label>Content *</label><textarea name="content" required></textarea><button class="btn btn-gold">Save Article</button><button type="button" class="btn btn-dark" id="clearBlog">Clear</button></form></div><div><h2>Published Articles</h2><div id="adminBlogs"></div></div></div></section></div></main></div><script src="assets/config.js"></script><script src="assets/app.js"></script><script>
let TOKEN="";
const login=document.getElementById("login"),panel=document.getElementById("panel");
async function adminApi(action,data={}){return api(action,{token:TOKEN,...data})}
document.getElementById("loginBtn").onclick=async()=>{try{const r=await api("adminLogin",{password:document.getElementById("password").value});TOKEN=r.token;login.classList.add("hidden");panel.classList.remove("hidden");loadAll()}catch(e){document.getElementById("loginMsg").textContent=e.message}};
document.querySelectorAll(".side[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".side").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));document.getElementById(b.dataset.tab).classList.remove("hidden")});
async function loadAll(){await loadStats();await loadConsultations();await loadBlogs()}
async function loadStats(){const r=await adminApi("getDashboard");document.getElementById("stats").innerHTML=`<div class="stat"><span>Total Requests</span><b>${r.stats.total}</b></div><div class="stat"><span>Pending</span><b>${r.stats.pending}</b></div><div class="stat"><span>Confirmed</span><b>${r.stats.confirmed}</b></div><div class="stat"><span>Articles</span><b>${r.stats.blogs}</b></div>`}
async function loadConsultations(){const r=await adminApi("getConsultations");document.getElementById("consultBody").innerHTML=(r.consultations||[]).map(x=>`<tr><td>${escapeHTML(x.timestamp||"")}</td><td>${escapeHTML(x.name||"")}</td><td>${escapeHTML(x.mobile||"")}</td><td>${escapeHTML(x.caseType||"")}</td><td>${escapeHTML(x.description||"")}</td><td><select onchange="changeStatus('${x.id}',this.value)"><option ${x.status==="Pending"?"selected":""}>Pending</option><option ${x.status==="Contacted"?"selected":""}>Contacted</option><option ${x.status==="Confirmed"?"selected":""}>Confirmed</option><option ${x.status==="Closed"?"selected":""}>Closed</option></select></td><td><button class="smallbtn danger" onclick="deleteConsult('${x.id}')">Delete</button></td></tr>`).join("")}
async function changeStatus(id,status){await adminApi("updateConsultation",{id,status});loadStats()}
async function deleteConsult(id){if(confirm("Delete this consultation request?")){await adminApi("deleteConsultation",{id});loadAll()}}
async function loadBlogs(){const r=await adminApi("getBlogs");document.getElementById("adminBlogs").innerHTML=(r.blogs||[]).map(b=>`<div class="card" style="margin-bottom:12px"><span class="tag">${escapeHTML(b.category||"")}</span><h3>${escapeHTML(b.title)}</h3><p class="muted">${escapeHTML(b.excerpt||"")}</p><button class="smallbtn" onclick='editBlog(${JSON.stringify(b)})'>Edit</button> <button class="smallbtn danger" onclick="deleteBlog('${b.id}')">Delete</button></div>`).join("")}
function editBlog(b){for(const k of ["id","title","category","excerpt","content"])document.querySelector(`#blogForm [name="${k}"]`).value=b[k]||"";document.querySelector('[data-tab="blogs"]').click()}
document.getElementById("clearBlog").onclick=()=>document.getElementById("blogForm").reset();
document.getElementById("blogForm").onsubmit=async e=>{e.preventDefault();await adminApi("saveBlog",{data:Object.fromEntries(new FormData(e.target).entries())});e.target.reset();loadBlogs();loadStats()}
async function deleteBlog(id){if(confirm("Delete this article?")){await adminApi("deleteBlog",{id});loadBlogs();loadStats()}}
</script></body></html>
